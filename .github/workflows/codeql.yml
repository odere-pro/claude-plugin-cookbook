name: codeql

# Static analysis (SAST) via CodeQL. This repo is Markdown + Bash + JSON with no compiled
# language, so we analyze the `actions` language — CodeQL inspects the GitHub Actions workflows
# themselves for security issues. Results upload to code-scanning and feed the OpenSSF Scorecard
# SAST check. Teaches docs/cookbook/14-supply-chain-and-governance.md.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code-scanning
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
